<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopUpMandu Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1677ff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 24px 16px 50px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #e5e7eb;
            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            margin-top: 0;
            font-size: 19px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .product:last-child {
            border-bottom: 0;
        }

        .product-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .product-image {
            width: 58px;
            height: 58px;
            border-radius: 9px;
            object-fit: cover;
            background: #eef2f7;
        }

        .product-name {
            font-weight: 600;
        }

        .product-info {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        .product-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #1677ff;
        }

        .payment-option {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .payment-option input {
            width: auto;
            margin: 0 8px 0 0;
        }

        .checkout-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #1677ff;
            color: white;
            font-size: 17px;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .checkout-button:hover {
            background: #0868ed;
        }

        .checkout-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            .container {
                padding: 18px 12px 40px;
            }

            .title {
                font-size: 23px;
            }

            .card {
                padding: 16px;
            }

            .product {
                align-items: flex-start;
            }

            .product-left {
                min-width: 0;
            }

            .product-image {
                width: 50px;
                height: 50px;
            }

            .product-price {
                font-size: 14px;
            }

        }
    </style>

</head>


<body>

    <div class="header">
        TopUpMandu
    </div>


    <main class="container">

        <div class="title">
            Checkout
        </div>


        <div id="error" class="error"></div>


        <div id="success" class="success"></div>


        <!-- ORDER -->

        <div class="card">

            <h2>
                🛒 Your Order
            </h2>

            <div id="cart-items">

                <div class="loading">
                    Loading your cart...
                </div>

            </div>


            <div class="total-row">

                <span>
                    Total
                </span>

                <span id="cart-total">
                    Rs. 0
                </span>

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="card">

            <h2>
                👤 Customer Details
            </h2>


            <label for="name">
                Full Name
            </label>

            <input type="text" id="name" placeholder="Enter your full name">


            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email">


            <label for="phone">
                Phone Number
            </label>

            <input type="tel" id="phone" placeholder="98XXXXXXXX">

        </div>


        <!-- GAME DETAILS -->

        <div class="card">

            <h2>
                🎮 Game Details
            </h2>


            <label for="player-id">
                Player ID / UID
            </label>

            <input type="text" id="player-id" placeholder="Enter your Player ID / UID">


            <label for="region">
                Region
            </label>

            <input type="text" id="region" placeholder="Enter region if required">

        </div>


        <!-- PAYMENT -->

        <div class="card">

            <h2>
                💳 Payment Method
            </h2>


            <label class="payment-option">

                <input type="radio" name="payment" value="esewa" checked>

                eSewa

            </label>


            <label class="payment-option">

                <input type="radio" name="payment" value="khalti">

                Khalti

            </label>


            <button id="place-order" class="checkout-button">
                Place Order
            </button>

        </div>

    </main>


    <script>

        const BACKEND =
            "https://topupmandu-checkout-app.vercel.app";


        /*
         * ==========================================
         * GET ENCODED CART FROM URL
         * ==========================================
         *
         * Shopify now sends:
         *
         * ?cart=XXXXXXXX
         *
         */


        function getEncodedCart() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("cart");

        }


        /*
         * ==========================================
         * DECODE CART
         * ==========================================
         */


        function getCartFromURL() {

            const encodedCart =
                getEncodedCart();


            if (!encodedCart) {

                throw new Error(
                    "No cart data was provided."
                );

            }


            try {

                /*
                 * URLSearchParams automatically
                 * converts %3D back to =
                 */

                const binaryString =
                    atob(encodedCart);


                /*
                 * Convert binary data back
                 * into UTF-8 text.
                 */

                const bytes =
                    Uint8Array.from(
                        binaryString,
                        function (character) {
                            return character.charCodeAt(0);
                        }
                    );


                const jsonString =
                    new TextDecoder(
                        "utf-8"
                    ).decode(bytes);


                const cart =
                    JSON.parse(
                        jsonString
                    );


                return cart;

            } catch (error) {

                console.error(
                    "Cart decoding error:",
                    error
                );

                throw new Error(
                    "The cart data could not be read."
                );

            }

        }


        /*
         * ==========================================
         * FORMAT MONEY
         * ==========================================
         *
         * Shopify prices are in cents.
         *
         * Example:
         *
         * 10000 = Rs. 100.00
         */


        function formatMoney(cents) {

            const amount =
                Number(cents || 0) / 100;


            return "Rs. " +
                amount.toLocaleString(
                    "en-NP",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }


        /*
         * ==========================================
         * ESCAPE HTML
         * ==========================================
         */


        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value == null
                    ? ""
                    : String(value);


            return div.innerHTML;

        }


        /*
         * ==========================================
         * DISPLAY CART
         * ==========================================
         */


        function displayCart(cart) {

            const container =
                document.getElementById(
                    "cart-items"
                );


            const total =
                document.getElementById(
                    "cart-total"
                );


            if (
                !cart ||
                !cart.items ||
                cart.items.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        Your cart is empty.
                    </div>
                `;


                total.textContent =
                    "Rs. 0";


                return;

            }


            let html = "";


            cart.items.forEach(
                function (item) {

                    const image =
                        item.image
                            ? `
                                <img
                                    class="product-image"
                                    src="${escapeHTML(item.image)}"
                                    alt="${escapeHTML(
                                item.title ||
                                "Product"
                            )}"
                                >
                              `
                            : "";


                    const title =
                        item.title ||
                        item.product_title ||
                        "Product";


                    const variant =
                        item.variant_title &&
                            item.variant_title !== "Default Title"
                            ? item.variant_title
                            : "";


                    const linePrice =
                        item.final_line_price ||
                        item.line_price ||
                        (
                            Number(
                                item.final_price ||
                                item.price ||
                                0
                            ) *
                            Number(
                                item.quantity ||
                                1
                            )
                        );


                    html += `

                        <div class="product">

                            <div class="product-left">

                                ${image}

                                <div>

                                    <div class="product-name">

                                        ${escapeHTML(
                        title
                    )}

                                    </div>

                                    <div class="product-info">

                                        ${variant
                            ? escapeHTML(
                                variant
                            ) +
                            " · "
                            : ""
                        }

                                        Quantity:
                                        ${escapeHTML(
                            item.quantity ||
                            1
                        )}

                                    </div>

                                </div>

                            </div>


                            <div class="product-price">

                                ${formatMoney(
                            linePrice
                        )}

                            </div>

                        </div>

                    `;

                }
            );


            container.innerHTML =
                html;


            total.textContent =
                formatMoney(
                    cart.total_price
                );

        }


        /*
         * ==========================================
         * CURRENT CART
         * ==========================================
         */


        let currentCart = null;


        /*
         * ==========================================
         * INITIALIZE CHECKOUT
         * ==========================================
         */


        function initialize() {

            try {

                console.log(
                    "TopUpMandu: Reading cart from URL..."
                );


                currentCart =
                    getCartFromURL();


                console.log(
                    "TopUpMandu decoded cart:",
                    currentCart
                );


                displayCart(
                    currentCart
                );


            } catch (error) {

                console.error(
                    "TopUpMandu cart error:",
                    error
                );


                document.getElementById(
                    "cart-items"
                ).innerHTML = `

                    <div class="empty">

                        Your cart could not be loaded.

                        <br><br>

                        <small>
                            ${escapeHTML(
                    error.message
                )}
                        </small>

                    </div>

                `;


                document.getElementById(
                    "cart-total"
                ).textContent =
                    "Rs. 0";


                const errorBox =
                    document.getElementById(
                        "error"
                    );


                errorBox.textContent =
                    error.message;


                errorBox.style.display =
                    "block";

            }

        }


        /*
         * START
         */

        initialize();


        /*
         * ==========================================
         * PLACE ORDER
         * ==========================================
         */


        document
            .getElementById(
                "place-order"
            )
            .addEventListener(
                "click",
                async function () {

                    const errorBox =
                        document.getElementById(
                            "error"
                        );


                    const successBox =
                        document.getElementById(
                            "success"
                        );


                    const button =
                        document.getElementById(
                            "place-order"
                        );


                    errorBox.style.display =
                        "none";


                    successBox.style.display =
                        "none";


                    if (!currentCart) {

                        errorBox.textContent =
                            "Your cart could not be loaded.";

                        errorBox.style.display =
                            "block";

                        return;

                    }


                    const name =
                        document.getElementById(
                            "name"
                        ).value.trim();


                    const email =
                        document.getElementById(
                            "email"
                        ).value.trim();


                    const phone =
                        document.getElementById(
                            "phone"
                        ).value.trim();


                    const playerId =
                        document.getElementById(
                            "player-id"
                        ).value.trim();


                    const region =
                        document.getElementById(
                            "region"
                        ).value.trim();


                    const paymentMethod =
                        document.querySelector(
                            'input[name="payment"]:checked'
                        )?.value ||
                        "esewa";


                    if (!name) {

                        errorBox.textContent =
                            "Please enter your full name.";

                        errorBox.style.display =
                            "block";

                        return;

                    }


                    if (!email) {

                        errorBox.textContent =
                            "Please enter your email.";

                        errorBox.style.display =
                            "block";

                        return;

                    }


                    if (!phone) {

                        errorBox.textContent =
                            "Please enter your phone number.";

                        errorBox.style.display =
                            "block";

                        return;

                    }


                    button.disabled =
                        true;


                    button.textContent =
                        "Creating Order...";


                    try {

                        /*
                         * Send the entire cart to
                         * the backend.
                         */

                        const response =
                            await fetch(
                                BACKEND +
                                "/create-order",
                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Accept":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            customer: {

                                                name:
                                                    name,

                                                email:
                                                    email,

                                                phone:
                                                    phone

                                            },

                                            items:
                                                currentCart.items,

                                            total_price:
                                                currentCart.total_price,

                                            currency:
                                                currentCart.currency,

                                            playerId:
                                                playerId,

                                            region:
                                                region,

                                            paymentMethod:
                                                paymentMethod

                                        })

                                }
                            );


                        const result =
                            await response.json();


                        console.log(
                            "Order response:",
                            result
                        );


                        if (
                            !response.ok ||
                            !result.success
                        ) {

                            throw new Error(
                                result.error ||
                                "Order creation failed."
                            );

                        }


                        successBox.textContent =
                            "Order created successfully! " +
                            (
                                result.order?.name ||
                                ""
                            );


                        successBox.style.display =
                            "block";


                        button.textContent =
                            "Order Created";


                    } catch (error) {

                        console.error(
                            "Order error:",
                            error
                        );


                        errorBox.textContent =
                            error.message;


                        errorBox.style.display =
                            "block";


                        button.disabled =
                            false;


                        button.textContent =
                            "Place Order";

                    }

                }
            );

    </script>

</body>

</html>
