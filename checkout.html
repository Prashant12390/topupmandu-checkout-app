<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopUpMandu Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070B14;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .checkout {
            max-width: 650px;
            margin: auto;
            padding: 20px;
        }

        .logo {
            text-align: center;
            color: #2997FF;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .card {
            background: #101827;
            border: 1px solid #202B3D;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 18px;
            margin: 0 0 15px;
        }

        .cart-item {
            padding: 14px 0;
            border-bottom: 1px solid #202B3D;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .item-title {
            font-weight: 700;
        }

        .item-variant {
            color: #9CA8BA;
            font-size: 13px;
            margin-top: 5px;
        }

        .item-price {
            color: #2997FF;
            font-weight: 800;
            white-space: nowrap;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 19px;
            font-weight: 800;
        }

        label {
            display: block;
            color: #9CA8BA;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #202B3D;
            background: #070B14;
            color: #fff;
            margin-bottom: 13px;
            outline: none;
        }

        input:focus {
            border-color: #1677FF;
        }

        .payment-option {
            padding: 14px;
            border: 1px solid #202B3D;
            border-radius: 9px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .payment-option.active {
            border-color: #1677FF;
            background: rgba(22, 119, 255, .12);
        }

        .payment-instructions {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #070B14;
            border-radius: 10px;
            color: #9CA8BA;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #1677FF;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            color: #9CA8BA;
        }
    </style>
</head>

<body>

    <div class="checkout">

        <div class="logo">
            💎 TopUpMandu
        </div>


        <!-- CART -->

        <div class="card">

            <h2>🛒 Your Order</h2>

            <div id="cartItems">
                <div class="loading">
                    Loading your cart...
                </div>
            </div>

            <div class="total">
                <span>Total</span>
                <span id="cartTotal">Rs. 0</span>
            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="card">

            <h2>👤 Customer Details</h2>

            <label>Full Name</label>

            <input id="customerName" type="text" placeholder="Your full name">

            <label>Email</label>

            <input id="customerEmail" type="email" placeholder="you@example.com">

            <label>Phone</label>

            <input id="customerPhone" type="tel" placeholder="98XXXXXXXX">

        </div>


        <!-- GAME DETAILS -->

        <div class="card">

            <h2>🎮 Game Details</h2>

            <div id="gameFields"></div>

        </div>


        <!-- PAYMENT -->

        <div class="card">

            <h2>💳 Payment Method</h2>

            <div class="payment-option" data-method="eSewa">
                🟢 eSewa
            </div>

            <div class="payment-option" data-method="Khalti">
                🟣 Khalti
            </div>

            <div id="paymentInstructions" class="payment-instructions"></div>

        </div>


        <!-- PLACE ORDER -->

        <div class="card">

            <button id="placeOrder">
                Place Order
            </button>

            <div id="message" class="message"></div>

        </div>

    </div>


    <script>

        const BACKEND_URL =
            "https://topupmandu-checkout-app.vercel.app";


        let cart = null;
        let selectedPayment = "";


        /* ===============================
           LOAD CART
        ================================ */

        async function loadCart() {

            const cartItems =
                document.getElementById("cartItems");

            try {

                /*
                 * The cart was saved by Shopify
                 * into sessionStorage before
                 * redirecting to this page.
                 */

                const savedCart =
                    sessionStorage.getItem("topupmandu_cart");


                if (!savedCart) {

                    cartItems.innerHTML = `
        <div class="loading">
          Your cart could not be loaded.
        </div>
      `;

                    return;

                }


                cart = JSON.parse(savedCart);


                if (!cart.items || cart.items.length === 0) {

                    cartItems.innerHTML = `
        <div class="loading">
          Your cart is empty.
        </div>
      `;

                    return;

                }


                renderCart();

                createGameFields();


            } catch (error) {

                console.error(error);

                cartItems.innerHTML = `
      <div class="loading">
        Unable to load your cart.
      </div>
    `;

            }

        }


        /* ===============================
           RENDER CART
        ================================ */

        function renderCart() {

            const container =
                document.getElementById("cartItems");


            container.innerHTML = "";


            cart.items.forEach(item => {

                const itemElement =
                    document.createElement("div");


                itemElement.className =
                    "cart-item";


                const price =
                    ((item.final_line_price || item.line_price) / 100)
                        .toFixed(2);


                itemElement.innerHTML = `

      <div class="item-row">

        <div>

          <div class="item-title">
            ${escapeHtml(item.product_title)}
          </div>

          <div class="item-variant">

            ${escapeHtml(item.variant_title || "")}

            × ${item.quantity}

          </div>

        </div>

        <div class="item-price">
          Rs. ${price}
        </div>

      </div>

    `;


                container.appendChild(itemElement);

            });


            const total =
                (cart.total_price / 100).toFixed(2);


            document.getElementById("cartTotal")
                .textContent =
                `Rs. ${total}`;

        }


        /* ===============================
           GAME FIELDS
        ================================ */

        function createGameFields() {

            const container =
                document.getElementById("gameFields");


            container.innerHTML = "";


            const hasFreeFire =
                cart.items.some(item =>
                    item.handle === "free-fire-diamonds"
                );


            const hasMobileLegends =
                cart.items.some(item =>
                    item.handle === "mobile-legends"
                );


            const productsNeedPlayerId = [
                "free-fire-diamonds",
                "pubg-uc",
                "clash-of-clans",
                "valorant-ios-only",
                "efootball-pes-2026",
                "genshin-impact",
                "brawl-stars",
                "roblox",
                "mobile-legends"
            ];


            const needsPlayerId =
                cart.items.some(item =>
                    productsNeedPlayerId.includes(item.handle)
                );


            if (needsPlayerId) {

                container.innerHTML += `

      <label>Player ID / UID</label>

      <input
        id="playerId"
        type="text"
        placeholder="Enter Player ID"
      >

    `;

            }


            if (hasMobileLegends) {

                container.innerHTML += `

      <label>Region</label>

      <input
        id="region"
        type="text"
        placeholder="Enter Region"
      >

    `;

            }

        }


        /* ===============================
           PAYMENT
        ================================ */

        document
            .querySelectorAll(".payment-option")
            .forEach(option => {

                option.addEventListener("click", () => {

                    selectedPayment =
                        option.dataset.method;


                    document
                        .querySelectorAll(".payment-option")
                        .forEach(item =>
                            item.classList.remove("active")
                        );


                    option.classList.add("active");


                    const instructions =
                        document.getElementById(
                            "paymentInstructions"
                        );


                    instructions.style.display =
                        "block";


                    if (selectedPayment === "eSewa") {

                        instructions.innerHTML = `

          <strong>eSewa Payment</strong><br><br>

          1. Open eSewa.<br>

          2. Send the exact order amount
             to the TopUpMandu eSewa account.<br>

          3. Keep your payment receipt.<br>

          4. Submit the order below.

        `;

                    }


                    if (selectedPayment === "Khalti") {

                        instructions.innerHTML = `

          <strong>Khalti Payment</strong><br><br>

          1. Open Khalti.<br>

          2. Send the exact order amount
             to the TopUpMandu Khalti account.<br>

          3. Keep your payment receipt.<br>

          4. Submit the order below.

        `;

                    }

                });

            });


        /* ===============================
           PLACE ORDER
        ================================ */

        document
            .getElementById("placeOrder")
            .addEventListener("click", async () => {

                const message =
                    document.getElementById("message");


                if (!cart || !cart.items?.length) {

                    message.textContent =
                        "Your cart is empty.";

                    return;

                }


                const name =
                    document
                        .getElementById("customerName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("customerEmail")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("customerPhone")
                        .value
                        .trim();


                const playerInput =
                    document.getElementById("playerId");


                const regionInput =
                    document.getElementById("region");


                const playerId =
                    playerInput
                        ? playerInput.value.trim()
                        : "";


                const region =
                    regionInput
                        ? regionInput.value.trim()
                        : "";


                if (!name || !email || !phone) {

                    message.textContent =
                        "Please complete your customer details.";

                    return;

                }


                if (!selectedPayment) {

                    message.textContent =
                        "Please select a payment method.";

                    return;

                }


                document
                    .getElementById("placeOrder")
                    .disabled = true;


                message.textContent =
                    "Creating your order...";


                try {

                    /*
                     * For now we send the first cart
                     * item to our backend.
                     *
                     * We will upgrade this next so
                     * multiple cart items are supported.
                     */

                    const firstItem =
                        cart.items[0];


                    const response =
                        await fetch(
                            `${BACKEND_URL}/create-order`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    customer: {

                                        name,
                                        email,
                                        phone

                                    },

                                    variantId:
                                        firstItem.variant_id,

                                    quantity:
                                        firstItem.quantity,

                                    packageName:
                                        firstItem.variant_title ||
                                        firstItem.product_title,

                                    playerId,

                                    region,

                                    paymentMethod:
                                        selectedPayment

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        throw new Error(
                            data.error ||
                            "Order creation failed."
                        );

                    }


                    message.innerHTML = `

        <strong>
          ✅ Order created successfully!
        </strong>

        <br><br>

        Order:
        ${escapeHtml(data.order.name)}

      `;


                    /*
                     * Prevent duplicate order submission.
                     */

                    sessionStorage.removeItem(
                        "topupmandu_cart"
                    );


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Order failed: " +
                        error.message;


                    document
                        .getElementById("placeOrder")
                        .disabled = false;

                }

            });


        /* ===============================
           HTML ESCAPE
        ================================ */

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value || "";

            return div.innerHTML;

        }


        /* ===============================
           START
        ================================ */

        loadCart();

    </script>

</body>

</html>
