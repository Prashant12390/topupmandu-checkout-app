<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopUpMandu Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1677ff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 24px 16px 50px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            margin-top: 0;
            font-size: 19px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .product:last-child {
            border-bottom: 0;
        }

        .product-name {
            font-weight: 600;
        }

        .product-info {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        .product-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #1677ff;
        }

        .payment-option {
            border: 1px solid #d1d5db;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .payment-option input {
            width: auto;
            margin: 0 8px 0 0;
        }

        .checkout-button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #1677ff;
            color: white;
            font-size: 17px;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .checkout-button:hover {
            background: #0868ed;
        }

        .checkout-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            .container {
                padding: 18px 12px 40px;
            }

            .title {
                font-size: 23px;
            }

            .card {
                padding: 16px;
            }

            .product {
                flex-direction: column;
                gap: 6px;
            }

        }
    </style>

</head>


<body>

    <div class="header">
        TopUpMandu
    </div>


    <main class="container">

        <div class="title">
            Checkout
        </div>


        <div id="error" class="error"></div>


        <div id="success" class="success"></div>


        <!-- ORDER -->

        <div class="card">

            <h2>
                🛒 Your Order
            </h2>

            <div id="cart-items">

                <div class="empty">
                    Loading your cart...
                </div>

            </div>


            <div class="total-row">

                <span>
                    Total
                </span>

                <span id="cart-total">
                    Rs. 0
                </span>

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="card">

            <h2>
                👤 Customer Details
            </h2>


            <label for="name">
                Full Name
            </label>

            <input type="text" id="name" placeholder="Enter your full name">


            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email">


            <label for="phone">
                Phone Number
            </label>

            <input type="tel" id="phone" placeholder="98XXXXXXXX">

        </div>


        <!-- GAME DETAILS -->

        <div class="card">

            <h2>
                🎮 Game Details
            </h2>


            <label for="player-id">
                Player ID / UID
            </label>

            <input type="text" id="player-id" placeholder="Enter your Player ID / UID">


            <label for="region">
                Region
            </label>

            <input type="text" id="region" placeholder="Enter region if required">

        </div>


        <!-- PAYMENT -->

        <div class="card">

            <h2>
                💳 Payment Method
            </h2>


            <label class="payment-option">

                <input type="radio" name="payment" value="esewa" checked>

                eSewa

            </label>


            <label class="payment-option">

                <input type="radio" name="payment" value="khalti">

                Khalti

            </label>


            <button id="place-order" class="checkout-button">
                Place Order
            </button>

        </div>

    </main>


    <script>

        const BACKEND =
            "https://topupmandu-checkout-app.vercel.app";


        // =====================================
        // GET CART ID FROM URL
        // =====================================

        function getCartId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("cart_id");

        }


        // =====================================
        // FORMAT MONEY
        // =====================================

        function formatMoney(cents) {

            const amount =
                Number(cents || 0) / 100;

            return "Rs. " +
                amount.toLocaleString(
                    "en-NP",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }


        // =====================================
        // ESCAPE HTML
        // =====================================

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value || "";

            return div.innerHTML;

        }


        // =====================================
        // DISPLAY CART
        // =====================================

        function displayCart(cart) {

            const container =
                document.getElementById(
                    "cart-items"
                );

            const total =
                document.getElementById(
                    "cart-total"
                );


            if (
                !cart ||
                !cart.items ||
                cart.items.length === 0
            ) {

                container.innerHTML = `
          <div class="empty">
            Your cart is empty.
          </div>
        `;

                total.textContent =
                    "Rs. 0";

                return;

            }


            let html = "";


            cart.items.forEach(
                function (item) {

                    html += `

            <div class="product">

              <div>

                <div class="product-name">

                  ${escapeHTML(
                        item.product_title ||
                        item.title ||
                        "Product"
                    )}

                </div>

                <div class="product-info">

                  Quantity:
                  ${item.quantity}

                </div>

              </div>


              <div class="product-price">

                ${formatMoney(
                        item.final_line_price ||
                        item.line_price
                    )}

              </div>

            </div>

          `;

                }
            );


            container.innerHTML =
                html;


            total.textContent =
                formatMoney(
                    cart.total_price
                );

        }


        // =====================================
        // LOAD CART FROM BACKEND
        // =====================================

        async function loadCart() {

            const cartId =
                getCartId();


            if (!cartId) {

                throw new Error(
                    "No cart ID was provided."
                );

            }


            const response =
                await fetch(
                    BACKEND +
                    "/cart/" +
                    encodeURIComponent(
                        cartId
                    )
                );


            if (!response.ok) {

                throw new Error(
                    "Cart could not be loaded."
                );

            }


            const result =
                await response.json();


            if (!result.success) {

                throw new Error(
                    result.error ||
                    "Cart could not be loaded."
                );

            }


            return result.cart;

        }


        // =====================================
        // INITIALIZE
        // =====================================

        let currentCart = null;


        async function initialize() {

            try {

                currentCart =
                    await loadCart();


                displayCart(
                    currentCart
                );


            } catch (error) {

                console.error(error);


                document.getElementById(
                    "cart-items"
                ).innerHTML = `

          <div class="empty">

            Your cart could not be loaded.

          </div>

        `;


                document.getElementById(
                    "cart-total"
                ).textContent =
                    "Rs. 0";

            }

        }


        initialize();


        // =====================================
        // PLACE ORDER
        // =====================================

        document
            .getElementById(
                "place-order"
            )
            .addEventListener(
                "click",
                async function () {

                    const error =
                        document.getElementById(
                            "error"
                        );

                    const success =
                        document.getElementById(
                            "success"
                        );

                    const button =
                        document.getElementById(
                            "place-order"
                        );


                    error.style.display =
                        "none";

                    success.style.display =
                        "none";


                    if (!currentCart) {

                        error.textContent =
                            "Your cart could not be loaded.";

                        error.style.display =
                            "block";

                        return;

                    }


                    const name =
                        document.getElementById(
                            "name"
                        ).value.trim();


                    const email =
                        document.getElementById(
                            "email"
                        ).value.trim();


                    const phone =
                        document.getElementById(
                            "phone"
                        ).value.trim();


                    const playerId =
                        document.getElementById(
                            "player-id"
                        ).value.trim();


                    const region =
                        document.getElementById(
                            "region"
                        ).value.trim();


                    const paymentMethod =
                        document.querySelector(
                            'input[name="payment"]:checked'
                        )?.value || "esewa";


                    if (!name) {

                        error.textContent =
                            "Please enter your full name.";

                        error.style.display =
                            "block";

                        return;

                    }


                    if (!email) {

                        error.textContent =
                            "Please enter your email.";

                        error.style.display =
                            "block";

                        return;

                    }


                    if (!phone) {

                        error.textContent =
                            "Please enter your phone number.";

                        error.style.display =
                            "block";

                        return;

                    }


                    button.disabled =
                        true;

                    button.textContent =
                        "Creating Order...";


                    try {

                        const response =
                            await fetch(
                                BACKEND +
                                "/create-order",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            customer: {

                                                name:
                                                    name,

                                                email:
                                                    email,

                                                phone:
                                                    phone

                                            },

                                            items:
                                                currentCart.items,

                                            playerId:
                                                playerId,

                                            region:
                                                region,

                                            paymentMethod:
                                                paymentMethod

                                        })

                                }
                            );


                        const result =
                            await response.json();


                        if (!response.ok ||
                            !result.success) {

                            throw new Error(
                                result.error ||
                                "Order creation failed."
                            );

                        }


                        success.textContent =
                            "Order created successfully! Order: " +
                            (
                                result.order?.name ||
                                ""
                            );


                        success.style.display =
                            "block";


                        button.textContent =
                            "Order Created";


                    } catch (error) {

                        console.error(error);


                        error.textContent =
                            error.message;


                        error.style.display =
                            "block";


                        button.disabled =
                            false;

                        button.textContent =
                            "Place Order";

                    }

                }
            );

    </script>

</body>

</html>
