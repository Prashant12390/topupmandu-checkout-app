<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TopUpMandu Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1677ff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 24px 16px 50px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            margin-top: 0;
            font-size: 19px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .product:last-child {
            border-bottom: 0;
        }

        .product-left {
            display: flex;
            gap: 12px;
            align-items: center;
            min-width: 0;
        }

        .product-image {
            width: 58px;
            height: 58px;
            border-radius: 9px;
            object-fit: cover;
            background: #eef2f7;
            flex-shrink: 0;
        }

        .product-name {
            font-weight: 600;
        }

        .product-info {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        .product-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: 700;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"] {

            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
            background: #fff;
        }

        input:focus {
            border-color: #1677ff;
        }

        .payment-option {

            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .payment-option:hover {
            border-color: #1677ff;
        }

        .payment-option input {

            width: auto;
            margin: 0 8px 0 0;
        }

        .payment-option.selected {
            border-color: #1677ff;
            background: #eff6ff;
        }

        /* QR */

        #payment-qr {
            display: none;
            text-align: center;
            margin-top: 18px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        #payment-qr h3 {
            margin: 0 0 12px;
            font-size: 17px;
        }

        #payment-qr img {
            width: 260px;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: white;
        }

        .qr-note {
            margin-top: 10px;
            color: #6b7280;
            font-size: 13px;
        }

        /* Screenshot */

        .upload-box {
            margin-top: 18px;
            padding: 16px;
            border: 1px dashed #9ca3af;
            border-radius: 12px;
            background: #f9fafb;
        }

        .upload-box strong {
            display: block;
            margin-bottom: 6px;
        }

        .upload-note {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .preview {
            display: none;
            margin-top: 12px;
            text-align: center;
        }

        .preview img {
            max-width: 260px;
            max-height: 350px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
        }

        .checkout-button {

            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #1677ff;
            color: white;
            font-size: 17px;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkout-button:hover {
            background: #0868ed;
        }

        .checkout-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {

            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .success {

            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #6b7280;
        }

        .required {
            color: #dc2626;
        }

        @media (max-width: 600px) {

            .container {
                padding: 18px 12px 40px;
            }

            .title {
                font-size: 23px;
            }

            .card {
                padding: 16px;
            }

            .product {
                align-items: flex-start;
            }

            .product-image {
                width: 50px;
                height: 50px;
            }

            .product-price {
                font-size: 14px;
            }

            #payment-qr img {
                width: 230px;
            }

        }
    </style>

</head>


<body>


    <div class="header">
        TopUpMandu
    </div>


    <main class="container">


        <div class="title">
            Checkout
        </div>


        <div id="error" class="error"></div>

        <div id="success" class="success"></div>


        <!-- ==========================================
             ORDER
        =========================================== -->

        <div class="card">

            <h2>
                🛒 Your Order
            </h2>

            <div id="cart-items">

                <div class="loading">
                    Loading your cart...
                </div>

            </div>


            <div class="total-row">

                <span>
                    Total
                </span>

                <span id="cart-total">
                    Rs. 0.00
                </span>

            </div>

        </div>


        <!-- ==========================================
             CUSTOMER DETAILS
        =========================================== -->

        <div class="card">

            <h2>
                👤 Customer Details
            </h2>


            <label for="name">
                Full Name
            </label>

            <input type="text" id="name" placeholder="Enter your full name">


            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email">


            <label for="phone">
                Phone Number
            </label>

            <input type="tel" id="phone" placeholder="98XXXXXXXX">

        </div>


        <!-- ==========================================
             GAME DETAILS
        =========================================== -->

        <div class="card" id="game-details-card" style="display:none;">

            <h2>
                🎮 Game Details
            </h2>

            <div id="game-fields"></div>

        </div>


        <!-- ==========================================
             PAYMENT
        =========================================== -->

        <div class="card">

            <h2>
                💳 Payment Method
            </h2>


            <label class="payment-option" id="esewa-option">

                <input type="radio" name="payment" value="esewa" checked>

                <span>
                    eSewa
                </span>

            </label>


            <label class="payment-option" id="khalti-option">

                <input type="radio" name="payment" value="khalti">

                <span>
                    Khalti
                </span>

            </label>


            <!-- QR CODE -->

            <div id="payment-qr">

                <h3 id="qr-title">
                    Scan to Pay with eSewa
                </h3>

                <img id="payment-qr-image" src="" alt="Payment QR Code">

                <div class="qr-note">
                    Scan this QR code and complete your payment.
                </div>

            </div>


            <!-- ==========================================
                 PAYMENT SCREENSHOT
            =========================================== -->

            <div class="upload-box">

                <strong>
                    📸 Payment Screenshot
                    <span class="required">*</span>
                </strong>

                <div class="upload-note">
                    After completing your payment, upload the payment screenshot here.
                </div>


                <input type="file" id="paymentScreenshot" accept="image/jpeg,image/png,image/webp">


                <div id="screenshot-preview" class="preview">

                    <img id="preview-image" src="" alt="Payment Screenshot Preview">

                </div>

            </div>


            <button id="place-order" class="checkout-button">
                Place Order
            </button>

        </div>


    </main>


    <script>


        /* ==========================================
           BACKEND
        =========================================== */

        const BACKEND =
            "https://topupmandu-checkout-app.vercel.app";


        /* ==========================================
           QR CODES
        =========================================== */

        const ESEWA_QR =
            "https://cdn.shopify.com/s/files/1/0807/1639/8824/files/WhatsApp_Image_2026-08-28_at_9.07.48_PM.jpg?v=1787933542";


        const KHALTI_QR =
            "https://cdn.shopify.com/s/files/1/0807/1639/8824/files/WhatsApp_Image_2026-08-28_at_9.07.35_PM.jpg?v=1787933542";


        /* ==========================================
           GAME PRODUCTS
        =========================================== */

        const gameProductHandles = [

            "free-fire-diamonds",
            "pubg-uc",
            "clash-of-clans",
            "valorant-ios-only",
            "efootball-pes-2026",
            "genshin-impact",
            "brawl-stars",
            "roblox",
            "mobile-legends"

        ];


        const gameProductTitles = [

            "Free Fire",
            "Free Fire Diamond",
            "PUBG",
            "PUBG UC",
            "Clash of Clans",
            "Valorant",
            "eFootball",
            "Genshin Impact",
            "Brawl Stars",
            "Roblox",
            "Mobile Legends"

        ];


        /* ==========================================
           GET CART
        ========================================== */

        function getEncodedCart() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("cart");

        }


        /* ==========================================
           DECODE CART
        ========================================== */

        function getCartFromURL() {

            const encodedCart =
                getEncodedCart();


            if (!encodedCart) {

                throw new Error(
                    "No cart data was provided in the URL."
                );

            }


            try {

                /*
                 * Support normal Base64 and
                 * URL-safe Base64.
                 */

                let base64 =
                    encodedCart
                        .replace(/-/g, "+")
                        .replace(/_/g, "/");


                /*
                 * Add missing padding.
                 */

                while (
                    base64.length % 4 !== 0
                ) {

                    base64 += "=";

                }


                const binaryString =
                    atob(base64);


                const bytes =
                    Uint8Array.from(
                        binaryString,
                        function (character) {

                            return character.charCodeAt(0);

                        }
                    );


                const jsonString =
                    new TextDecoder("utf-8")
                        .decode(bytes);


                const cart =
                    JSON.parse(jsonString);


                return cart;

            } catch (error) {

                console.error(
                    "Cart decoding error:",
                    error
                );


                throw new Error(
                    "The cart data could not be read."
                );

            }

        }


        /* ==========================================
           MONEY
        ========================================== */

        function formatMoney(cents) {

            const amount =
                Number(cents || 0) / 100;


            return "Rs. " +
                amount.toLocaleString(
                    "en-NP",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            const div =
                document.createElement("div");


            div.textContent =
                value == null
                    ? ""
                    : String(value);


            return div.innerHTML;

        }


        /* ==========================================
           CURRENT CART
        ========================================== */

        let currentCart = null;


        /* ==========================================
           CHECK IF GAME PRODUCT
        ========================================== */

        function isGameProduct(item) {

            const title =
                (
                    item.title ||
                    item.product_title ||
                    ""
                ).toLowerCase();


            if (
                gameProductTitles.some(
                    function (game) {

                        return title.includes(
                            game.toLowerCase()
                        );

                    }
                )
            ) {

                return true;

            }


            if (
                item.handle &&
                gameProductHandles.includes(
                    item.handle
                )
            ) {

                return true;

            }


            return false;

        }


        /* ==========================================
           DISPLAY GAME FIELDS
        ========================================== */

        function displayGameFields(cart) {

            const card =
                document.getElementById(
                    "game-details-card"
                );


            const fields =
                document.getElementById(
                    "game-fields"
                );


            if (!card || !fields) {
                return;
            }


            const gameItem =
                cart.items.find(
                    function (item) {

                        return isGameProduct(item);

                    }
                );


            if (!gameItem) {

                card.style.display =
                    "none";

                fields.innerHTML =
                    "";

                return;

            }


            card.style.display =
                "block";


            const title =
                (
                    gameItem.title ||
                    gameItem.product_title ||
                    ""
                ).toLowerCase();


            /*
             * MOBILE LEGENDS
             * UID + REGION
             */

            if (
                title.includes(
                    "mobile legends"
                )
            ) {

                fields.innerHTML = `

                    <label for="player-id">
                        UID <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="player-id"
                        placeholder="Enter your Mobile Legends UID"
                        autocomplete="off"
                    >


                    <label for="region">
                        Region <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="region"
                        placeholder="Enter your Region"
                        autocomplete="off"
                    >

                `;

            }

            /*
             * ALL OTHER GAMES
             */

            else {

                fields.innerHTML = `

                    <label for="player-id">
                        Player ID / UID
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="player-id"
                        placeholder="Enter your Player ID / UID"
                        autocomplete="off"
                    >

                `;

            }

        }


        /* ==========================================
           DISPLAY CART
        ========================================== */

        function displayCart(cart) {

            const container =
                document.getElementById(
                    "cart-items"
                );


            const total =
                document.getElementById(
                    "cart-total"
                );


            if (
                !cart ||
                !Array.isArray(cart.items) ||
                cart.items.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">
                        Your cart is empty.
                    </div>

                `;


                total.textContent =
                    "Rs. 0.00";


                return;

            }


            let html = "";


            cart.items.forEach(
                function (item) {


                    const title =
                        item.title ||
                        item.product_title ||
                        "Product";


                    const variant =
                        item.variant_title &&
                            item.variant_title !==
                            "Default Title"

                            ? item.variant_title

                            : "";


                    const quantity =
                        Number(
                            item.quantity || 1
                        );


                    const linePrice =
                        item.final_line_price != null

                            ? Number(
                                item.final_line_price
                            )

                            : item.line_price != null

                                ? Number(
                                    item.line_price
                                )

                                : Number(
                                    item.final_price ||
                                    item.price ||
                                    0
                                ) * quantity;


                    const image =
                        item.image
                            ? `

                                <img
                                    class="product-image"
                                    src="${escapeHTML(
                                item.image
                            )}"
                                    alt="${escapeHTML(
                                title
                            )}"
                                >

                              `
                            : "";


                    html += `

                        <div class="product">

                            <div class="product-left">

                                ${image}

                                <div>

                                    <div class="product-name">

                                        ${escapeHTML(
                        title
                    )}

                                    </div>


                                    <div class="product-info">

                                        ${variant
                            ? escapeHTML(
                                variant
                            ) + " · "
                            : ""
                        }

                                        Quantity:
                                        ${quantity}

                                    </div>

                                </div>

                            </div>


                            <div class="product-price">

                                ${formatMoney(
                            linePrice
                        )}

                            </div>

                        </div>

                    `;

                }
            );


            container.innerHTML =
                html;


            /*
             * Calculate total safely.
             */

            let totalCents =
                Number(
                    cart.total_price
                );


            if (
                !Number.isFinite(
                    totalCents
                )
            ) {

                totalCents =
                    cart.items.reduce(
                        function (sum, item) {

                            const quantity =
                                Number(
                                    item.quantity || 1
                                );


                            const price =
                                Number(
                                    item.final_price ||
                                    item.price ||
                                    0
                                );


                            return sum +
                                (
                                    price *
                                    quantity
                                );

                        },
                        0
                    );

            }


            total.textContent =
                formatMoney(
                    totalCents
                );


            displayGameFields(
                cart
            );

        }


        /* ==========================================
           PAYMENT QR
        ========================================== */

        function updatePaymentQR() {

            const selected =
                document.querySelector(
                    'input[name="payment"]:checked'
                );


            const qrBox =
                document.getElementById(
                    "payment-qr"
                );


            const qrImage =
                document.getElementById(
                    "payment-qr-image"
                );


            const qrTitle =
                document.getElementById(
                    "qr-title"
                );


            const esewaOption =
                document.getElementById(
                    "esewa-option"
                );


            const khaltiOption =
                document.getElementById(
                    "khalti-option"
                );


            if (!selected) {

                qrBox.style.display =
                    "none";

                return;

            }


            /*
             * eSewa
             */

            if (
                selected.value ===
                "esewa"
            ) {

                qrImage.src =
                    ESEWA_QR;


                qrTitle.textContent =
                    "Scan to Pay with eSewa";


                qrBox.style.display =
                    "block";


                esewaOption.classList.add(
                    "selected"
                );


                khaltiOption.classList.remove(
                    "selected"
                );

            }


            /*
             * Khalti
             */

            else if (
                selected.value ===
                "khalti"
            ) {

                qrImage.src =
                    KHALTI_QR;


                qrTitle.textContent =
                    "Scan to Pay with Khalti";


                qrBox.style.display =
                    "block";


                khaltiOption.classList.add(
                    "selected"
                );


                esewaOption.classList.remove(
                    "selected"
                );

            }

        }


        /* ==========================================
           SCREENSHOT PREVIEW
        ========================================== */

        document
            .getElementById(
                "paymentScreenshot"
            )
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    const preview =
                        document.getElementById(
                            "screenshot-preview"
                        );


                    const previewImage =
                        document.getElementById(
                            "preview-image"
                        );


                    if (!file) {

                        preview.style.display =
                            "none";

                        previewImage.src =
                            "";

                        return;

                    }


                    /*
                     * Maximum 5 MB
                     */

                    if (
                        file.size >
                        5 * 1024 * 1024
                    ) {

                        this.value =
                            "";


                        preview.style.display =
                            "none";


                        showError(
                            "Payment screenshot must be smaller than 5 MB."
                        );


                        return;

                    }


                    /*
                     * Images only
                     */

                    if (
                        !file.type.startsWith(
                            "image/"
                        )
                    ) {

                        this.value =
                            "";


                        preview.style.display =
                            "none";


                        showError(
                            "Please upload an image file."
                        );


                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            previewImage.src =
                                event.target.result;


                            preview.style.display =
                                "block";

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );


        /* ==========================================
           PAYMENT CHANGE
        ========================================== */

        document
            .querySelectorAll(
                'input[name="payment"]'
            )
            .forEach(
                function (radio) {

                    radio.addEventListener(
                        "change",
                        updatePaymentQR
                    );

                }
            );


        /* ==========================================
           ERROR
        ========================================== */

        function showError(message) {

            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.textContent =
                message;


            errorBox.style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* ==========================================
           SUCCESS
        ========================================== */

        function showSuccess(message) {

            const successBox =
                document.getElementById(
                    "success"
                );


            successBox.textContent =
                message;


            successBox.style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* ==========================================
           INITIALIZE
        ========================================== */

        function initialize() {

            try {

                console.log(
                    "TopUpMandu: Reading cart..."
                );


                currentCart =
                    getCartFromURL();


                console.log(
                    "TopUpMandu cart:",
                    currentCart
                );


                displayCart(
                    currentCart
                );


                /*
                 * Show eSewa QR by default.
                 */

                updatePaymentQR();


            } catch (error) {

                console.error(
                    "TopUpMandu cart error:",
                    error
                );


                document.getElementById(
                    "cart-items"
                ).innerHTML = `

                    <div class="empty">

                        Your cart could not be loaded.

                        <br><br>

                        <small>
                            ${escapeHTML(
                    error.message
                )}
                        </small>

                    </div>

                `;


                document.getElementById(
                    "cart-total"
                ).textContent =
                    "Rs. 0.00";


                showError(
                    error.message
                );

            }

        }


        /* ==========================================
           START
        ========================================== */

        initialize();


        /* ==========================================
           PLACE ORDER
        ========================================== */

        document
            .getElementById(
                "place-order"
            )
            .addEventListener(
                "click",
                async function () {


                    const errorBox =
                        document.getElementById(
                            "error"
                        );


                    const successBox =
                        document.getElementById(
                            "success"
                        );


                    const button =
                        document.getElementById(
                            "place-order"
                        );


                    errorBox.style.display =
                        "none";


                    successBox.style.display =
                        "none";


                    if (!currentCart) {

                        showError(
                            "Your cart could not be loaded."
                        );

                        return;

                    }


                    /* ==================================
                       CUSTOMER
                    ================================== */

                    const name =
                        document.getElementById(
                            "name"
                        ).value.trim();


                    const email =
                        document.getElementById(
                            "email"
                        ).value.trim();


                    const phone =
                        document.getElementById(
                            "phone"
                        ).value.trim();


                    /* ==================================
                       GAME DETAILS
                    ================================== */

                    const playerElement =
                        document.getElementById(
                            "player-id"
                        );


                    const regionElement =
                        document.getElementById(
                            "region"
                        );


                    const playerId =
                        playerElement
                            ? playerElement.value.trim()
                            : "";


                    const region =
                        regionElement
                            ? regionElement.value.trim()
                            : "";


                    const gameCard =
                        document.getElementById(
                            "game-details-card"
                        );


                    const gameRequired =
                        gameCard &&
                        gameCard.style.display !==
                        "none";


                    /* ==================================
                       PAYMENT
                    ================================== */

                    const paymentElement =
                        document.querySelector(
                            'input[name="payment"]:checked'
                        );


                    const paymentMethod =
                        paymentElement
                            ? paymentElement.value
                            : "esewa";


                    /* ==================================
                       SCREENSHOT
                    ================================== */

                    const screenshotInput =
                        document.getElementById(
                            "paymentScreenshot"
                        );


                    const screenshot =
                        screenshotInput.files[0];


                    /* ==================================
                       VALIDATION
                    ================================== */

                    if (!name) {

                        showError(
                            "Please enter your full name."
                        );

                        return;

                    }


                    if (!email) {

                        showError(
                            "Please enter your email."
                        );

                        return;

                    }


                    if (!phone) {

                        showError(
                            "Please enter your phone number."
                        );

                        return;

                    }


                    if (
                        gameRequired &&
                        !playerId
                    ) {

                        showError(
                            "Please enter your Player ID / UID."
                        );

                        return;

                    }


                    if (
                        gameRequired &&
                        regionElement &&
                        !region
                    ) {

                        showError(
                            "Please enter your Region."
                        );

                        return;

                    }


                    if (!screenshot) {

                        showError(
                            "Please upload your payment screenshot."
                        );

                        return;

                    }


                    if (
                        screenshot.size >
                        5 * 1024 * 1024
                    ) {

                        showError(
                            "Payment screenshot must be smaller than 5 MB."
                        );

                        return;

                    }


                    /* ==================================
                       DISABLE BUTTON
                    ================================== */

                    button.disabled =
                        true;


                    button.textContent =
                        "Uploading Payment...";


                    try {


                        /* ==================================
                           FORM DATA
                        ================================== */

                        const formData =
                            new FormData();


                        formData.append(
                            "customer",
                            JSON.stringify({
                                name:
                                    name,
                                email:
                                    email,
                                phone:
                                    phone
                            })
                        );


                        formData.append(
                            "items",
                            JSON.stringify(
                                currentCart.items
                            )
                        );


                        formData.append(
                            "total_price",
                            currentCart.total_price
                        );


                        formData.append(
                            "currency",
                            currentCart.currency ||
                            "NPR"
                        );


                        formData.append(
                            "playerId",
                            playerId
                        );


                        formData.append(
                            "region",
                            region
                        );


                        formData.append(
                            "paymentMethod",
                            paymentMethod
                        );


                        formData.append(
                            "paymentScreenshot",
                            screenshot
                        );


                        /* ==================================
                           SEND TO BACKEND
                        ================================== */

                        const response =
                            await fetch(
                                BACKEND +
                                "/create-order",
                                {

                                    method:
                                        "POST",

                                    body:
                                        formData

                                }
                            );


                        let result;


                        try {

                            result =
                                await response.json();

                        } catch (jsonError) {

                            throw new Error(
                                "The server returned an invalid response."
                            );

                        }


                        console.log(
                            "Order response:",
                            result
                        );


                        if (!response.ok || !result.success) {

                            let message = "Order creation failed.";

                            if (result.error) {
                                message = result.error;
                            }

                            if (result.errors) {
                                if (Array.isArray(result.errors)) {
                                    message = result.errors
                                        .map(e => e.message || JSON.stringify(e))
                                        .join("\n");
                                } else {
                                    message = JSON.stringify(result.errors);
                                }
                            }

                            throw new Error(message);
                        }


                        /* ==================================
                           SUCCESS
                        ================================== */

                        showSuccess(

                            "Payment screenshot received and order created successfully! " +
                            (
                                result.order &&
                                    result.order.name
                                    ? result.order.name
                                    : ""
                            )

                        );


                        button.textContent =
                            "Order Created ✓";


                        button.disabled =
                            true;


                    } catch (error) {

                        console.error(
                            "Order error:",
                            error
                        );


                        showError(
                            error.message
                        );


                        button.disabled =
                            false;


                        button.textContent =
                            "Place Order";

                    }

                }
            );

    </script>

</body>

</html>
